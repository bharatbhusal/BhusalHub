name: CI

on:
 push:
  branches: [develop, feat/**]
 pull_request:
  branches: [develop]

jobs:
 identity:
  runs-on: ubuntu-latest
  defaults:
   run:
    working-directory: src/api

  steps:
   - uses: actions/checkout@v4

   - name: Setup .NET
     uses: actions/setup-dotnet@v4
     with:
      dotnet-version: 9.0.x

   - name: Restore
     run: dotnet restore

   - name: Build
     run: dotnet build --no-restore --configuration Release

   - name: Test
     run: dotnet test ../../tests/api/BhusalHub.Tests.csproj --configuration Release --no-build --verbosity normal

 messages:
  runs-on: ubuntu-latest
  defaults:
   run:
    working-directory: src/messages

  steps:
   - uses: actions/checkout@v4

   - name: Setup .NET
     uses: actions/setup-dotnet@v4
     with:
      dotnet-version: 9.0.x

   - name: Restore
     run: dotnet restore

   - name: Build
     run: dotnet build --no-restore --configuration Release

 frontend:
  runs-on: ubuntu-latest
  defaults:
   run:
    working-directory: src/web

  steps:
   - uses: actions/checkout@v4

   - name: Setup Node
     uses: actions/setup-node@v4
     with:
      node-version: 20
      cache: npm

   - name: Install
     run: npm ci

   - name: Lint
     run: npx tsc --noEmit

   - name: Build
     run: npm run build
